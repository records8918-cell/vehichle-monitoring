<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Monitor PH — Baguio City Engineering</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0b0f19',
                            card: '#161f30',
                            accent: '#10b981',
                            border: '#243249'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom print overrides */
        @media print {
            body { background: #ffffff !important; color: #000000 !important; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            .print-card { border: 1px solid #e2e8f0 !important; background: #ffffff !important; color: #000000 !important; box-shadow: none !important; }
            .print-table th { background-color: #f1f5f9 !important; color: #0f172a !important; border-bottom: 2px solid #cbd5e1 !important; }
            .print-table td { border-bottom: 1px solid #e2e8f0 !important; color: #0f172a !important; }
            .print-badge { border: 1px solid #000000 !important; background: transparent !important; color: #000000 !important; }
        }
    </style>
</head>
<body class="h-full text-slate-100 flex overflow-hidden font-sans">

    <!-- Global File Input for Repository Uploads -->
    <input type="file" id="global-hidden-uploader" class="hidden" accept="application/pdf,image/*" onchange="processSelectedFile(this)">

    <!-- Loading Spinner Overlay -->
    <div id="loading-spinner" class="fixed inset-0 bg-brand-dark/80 backdrop-blur-sm z-[9999] flex items-center justify-center hidden">
        <div class="flex flex-col items-center gap-4">
            <svg class="animate-spin h-12 w-12 text-emerald-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span class="text-sm font-medium text-slate-300 tracking-wider">Syncing Cloud Database...</span>
        </div>
    </div>

    <!-- Security Gatekeeper Overlay -->
    <div class="fixed inset-0 bg-brand-dark z-[8888] flex items-center justify-center p-4" id="gatekeeper-lock">
        <div class="bg-brand-card border border-brand-border w-full max-w-md rounded-xl p-8 shadow-2xl text-center">
            <div class="mx-auto w-16 h-16 bg-emerald-500/10 text-emerald-400 rounded-full flex items-center justify-center mb-6">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>
            <h2 class="text-2xl font-bold tracking-tight text-white mb-1">FLEET MONITOR PH</h2>
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-6">City Engineering Office • Baguio</p>
            <form id="gatekeeper-form" onsubmit="verifySecurityAccess(event)">
                <div class="mb-4">
                    <input type="password" id="gatekeeper-pass" class="w-full bg-brand-dark border border-brand-border rounded-lg px-4 py-3 text-center text-lg tracking-widest text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3 px-4 rounded-lg font-semibold transition-all shadow-lg shadow-emerald-900/20 flex items-center justify-center gap-2">
                    🔑 Verify Access Credentials
                </button>
                <div class="text-rose-500 text-sm font-semibold mt-4 hidden" id="gatekeeper-error">Invalid security password. Access denied.</div>
            </form>
        </div>
    </div>

    <!-- Sidebar Navigation -->
    <div class="w-64 bg-brand-card border-r border-brand-border flex flex-col justify-between no-print shrink-0">
        <div>
            <div class="p-6 border-b border-brand-border">
                <h2 class="text-lg font-bold tracking-tight text-white">FLEET MONITOR PH</h2>
                <span class="text-xs font-semibold text-emerald-500 uppercase tracking-wider block mt-1">City Engineering Office</span>
            </div>
            <div class="py-6 px-3 space-y-1">
                <span class="px-3 text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-2">Operations</span>
                <button id="side-nav-dashboard" onclick="switchActiveView('dashboard')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all text-slate-300 hover:bg-slate-800/50 hover:text-white group [&.active]:bg-emerald-500/10 [&.active]:text-emerald-400 [&.active]:font-semibold active">
                    <svg class="w-5 h-5 text-slate-400 group-hover:text-white group-[.active]:text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                    Main Dashboard
                </button>
                <button id="side-nav-reports" onclick="switchActiveView('reports')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all text-slate-300 hover:bg-slate-800/50 hover:text-white group [&.active]:bg-emerald-500/10 [&.active]:text-emerald-400 [&.active]:font-semibold">
                    <svg class="w-5 h-5 text-slate-400 group-hover:text-white group-[.active]:text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    Executive Reports
                </button>
                <button id="side-nav-repository" onclick="switchActiveView('repository')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all text-slate-300 hover:bg-slate-800/50 hover:text-white group [&.active]:bg-emerald-500/10 [&.active]:text-emerald-400 [&.active]:font-semibold">
                    <svg class="w-5 h-5 text-slate-400 group-hover:text-white group-[.active]:text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 4H6a2 2 0 00-2 2v12a2 2 0 00-2 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-2m-4-1v8m0 0l3-3m-3 3L9 8m-5 5h2.586a1 1 0 01.707.293l2.414 2.414a1 1 0 00.707.293h3.172a1 1 0 00.707-.293l2.414-2.414a1 1 0 01.707-.293H20"></path></svg>
                    Docs Repository
                </button>
                <button id="side-nav-utilities" onclick="switchActiveView('utilities')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all text-slate-300 hover:bg-slate-800/50 hover:text-white group [&.active]:bg-emerald-500/10 [&.active]:text-emerald-400 [&.active]:font-semibold">
                    <svg class="w-5 h-5 text-slate-400 group-hover:text-white group-[.active]:text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    System Utilities
                </button>
