<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Monitor PH - CEO Baguio</title>
    <style>
        :root {
            --bg-dark: #121824;
            --bg-card: #1c2434;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --accent-amber: #f59e0b;
            --accent-red: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #2e3a50;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        .login-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--bg-dark); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .login-box { background-color: var(--bg-card); border: 1px solid var(--border-color); width: 100%; max-width: 400px; border-radius: 12px; padding: 40px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); text-align: center; }
        .login-box h2 { font-size: 1.4rem; font-weight: 700; color: #fff; margin-bottom: 6px; letter-spacing: 0.5px; }
        .login-box p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 28px; text-transform: uppercase; font-weight: 600; letter-spacing: 1px; }
        .login-group { margin-bottom: 20px; text-align: left; }
        .login-input { width: 100%; background-color: var(--bg-dark); border: 1px solid var(--border-color); border-radius: 6px; padding: 12px 16px; color: #fff; font-size: 1.05rem; letter-spacing: 3px; text-align: center; outline: none; transition: border-color 0.2s; }
        .login-input:focus { border-color: var(--accent-green); }
        .btn-login { width: 100%; background-color: var(--accent-green); color: #fff; border: none; padding: 12px; font-weight: 600; font-size: 0.95rem; cursor: pointer; border-radius: 6px; transition: opacity 0.2s; }
        .btn-login:hover { opacity: 0.9; }
        .login-error { color: var(--accent-red); font-size: 0.85rem; margin-top: 12px; display: none; font-weight: 500; }

        .sidebar { width: 260px; background-color: var(--bg-card); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; justify-content: space-between; }
        .sidebar-brand { padding: 24px; border-bottom: 1px solid var(--border-color); }
        .sidebar-brand h2 { font-size: 1.2rem; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
        .sidebar-brand p { font-size: 0.75rem; color: var(--accent-green); margin-top: 4px; text-transform: uppercase; font-weight: 600; }
        .sidebar-menu { padding: 16px 0; flex-grow: 1; overflow-y: auto; }
        .sidebar-heading { padding: 0 24px 8px 24px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; }
        .sidebar-item { display: flex; align-items: center; padding: 12px 24px; color: var(--text-muted); text-decoration: none; cursor: pointer; transition: all 0.2s; font-size: 0.95rem; }
        .sidebar-item:hover { background-color: rgba(255,255,255,0.03); color: #fff; }
        .sidebar-item.active { background-color: rgba(16, 185, 129, 0.1); color: var(--accent-green); border-left: 4px solid var(--accent-green); font-weight: 600; }
        .sidebar-footer { padding: 16px 24px; border-top: 1px solid var(--border-color); font-size: 0.8rem; color: var(--text-muted); }

        .workspace { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        .top-bar { height: 70px; background-color: var(--bg-card); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 32px; }
        .top-bar-title h1 { font-size: 1.3rem; font-weight: 600; color: #fff; }
        .main-content { padding: 32px; overflow-y: auto; flex-grow: 1; display: none; }
        .main-content.active-view { display: block; }

        .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; margin-bottom: 32px; }
        .metric-card { background-color: var(--bg-card); border: 1px solid var(--border-color); padding: 24px; border-radius: 8px; display: flex; flex-direction: column; }
        .metric-title { font-size: 0.85rem; text-transform: uppercase; font-weight: 600; color: var(--text-muted); letter-spacing: 0.5px; }
        .metric-value { font-size: 2rem; font-weight: 700; color: #fff; margin: 8px 0 4px 0; }
        .metric-subtext { font-size: 0.8rem; color: var(--text-muted); }
        .card-total { border-top: 4px solid var(--accent-blue); }
        .card-expired { border-top: 4px solid var(--accent-red); }
        .card-warning { border-top: 4px solid var(--accent-amber); }
        .card-valid { border-top: 4px solid var(--accent-green); }

        .alerts-panel { background: rgba(245, 158, 11, 0.05); border: 1px solid rgba(245, 158, 11, 0.2); border-radius: 8px; padding: 20px; margin-bottom: 32px; }
        .alerts-panel-header { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--accent-amber); margin-bottom: 12px; font-size: 0.95rem; }
        .alert-item { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.15); padding: 12px 16px; border-radius: 6px; margin-bottom: 8px; border-left: 3px solid var(--accent-amber); font-size: 0.9rem; }
        .alert-item:last-child { margin-bottom: 0; }
        .alert-tag { background: rgba(245,158,11,0.15); color: var(--accent-amber); padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; margin-left: 8px; }
        .alert-days { font-weight: 600; color: #fff; }

        .filter-toolbar { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; gap: 24px; margin-bottom: 24px; }
        .search-wrapper { position: relative; flex-grow: 1; max-width: 400px; }
        .search-input { width: 100%; background-color: var(--bg-dark); border: 1px solid var(--border-color); border-radius: 6px; padding: 10px 16px; color: #fff; font-size: 0.9rem; outline: none; transition: border 0.2s; }
        .search-input:focus { border-color: var(--accent-green); }
        .filter-groups-wrapper { display: flex; gap: 24px; }
        .filter-segment-label { font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); font-weight: 600; margin-bottom: 6px; letter-spacing: 0.5px; }
        .filter-btn-group { display: flex; background-color: var(--bg-dark); border: 1px solid var(--border-color); border-radius: 6px; padding: 3px; }
        .filter-btn { border: none; background: none; color: var(--text-muted); padding: 6px 12px; font-size: 0.85rem; font-weight: 500; border-radius: 4px; cursor: pointer; transition: all 0.2s; }
        .filter-btn:hover { color: #fff; }
        .filter-btn.active { background-color: var(--border-color); color: #fff; }

        .table-container { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
        .data-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.95rem; }
        .data-table th { background-color: rgba(0,0,0,0.15); padding: 16px 24px; font-weight: 600; color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border-color); }
        .data-table td { padding: 16px 24px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
        .data-table tr:last-child td { border-bottom: none; }
        .data-table tr:hover td { background-color: rgba(255,255,255,0.01); }
        .td-plate { font-family: monospace; font-size: 1.05rem; font-weight: 700; letter-spacing: 0.5px; color: #fff; }
        .text-unassigned { color: var(--text-muted); font-style: italic; font-size: 0.9rem; }

        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; text-align: center; min-width: 85px; }
        .status-badge.valid { background-color: rgba(16,185,129,0.15); color: var(--accent-green); }
        .status-badge.expiring { background-color: rgba(245,158,11,0.15); color: var(--accent-amber); }
        .status-badge.expired { background-color: rgba(239,68,68,0.15); color: var(--accent-red); }

        .btn-action { background-color: var(--bg-dark); border: 1px solid var(--border-color); color: var(--text-main); padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
        .btn-action:hover { border-color: var(--text-muted); background-color: var(--border-color); }
        .btn-primary { background-color: var(--accent-green); color: #fff; border: none; padding: 10px 20px; font-weight: 600; font-size: 0.9rem; cursor: pointer; border-radius: 6px; display: inline-flex; align-items: center; gap: 8px; transition: opacity 0.2s; }
        .btn-primary:hover { opacity: 0.9; }

        .btn-link-doc { background-color: rgba(59, 130, 246, 0.15); color: var(--accent-blue); border: 1px solid rgba(59, 130, 246, 0.3); }
        .btn-link-doc:hover { border-color: var(--accent-blue); background-color: rgba(59, 130, 246, 0.25); }
        .doc-link-anchor { display: inline-flex; align-items: center; gap: 6px; color: var(--accent-green); text-decoration: none; font-weight: 600; font-size: 0.9rem; }
