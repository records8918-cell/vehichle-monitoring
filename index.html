<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Monitor PH</title>
    <style>
        :root {
            --bg-dark: #121824;
            --bg-card: #1e2640;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --accent-red: #ef4444;
            --border-color: #374151;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; min-height: 100vh; overflow-x: hidden; }
        
        /* Layout Structure */
        .sidebar { width: 240px; background-color: #0f141c; border-right: 1px solid var(--border-color); padding: 24px; display: flex; flex-direction: column; justify-content: space-between; position: fixed; height: 100vh; }
        .sidebar-brand h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.5px; }
        .sidebar-brand span { font-size: 0.75rem; color: var(--accent-green); font-weight: 600; display: block; margin-top: 2px; }
        .nav-menu { list-style: none; margin-top: 40px; flex-grow: 1; }
        .nav-item { padding: 12px 16px; border-radius: 6px; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; gap: 12px; margin-bottom: 8px; font-weight: 500; }
        .nav-item.active { background-color: #1e293b; color: var(--accent-green); }
        .sidebar-footer { font-size: 0.75rem; color: var(--text-muted); line-height: 1.4; border-top: 1px solid var(--border-color); padding-top: 16px; }

        .main-content { margin-left: 240px; flex-grow: 1; padding: 40px; width: calc(100% - 240px); }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        
        /* KPI Cards */
        .kpi-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; margin-bottom: 32px; }
        .kpi-card { background-color: var(--bg-card); border-radius: 8px; padding: 24px; border-top: 4px solid var(--border-color); }
        .kpi-card.blue { border-top-color: #3b82f6; }
        .kpi-card.red { border-top-color: var(--accent-red); }
        .kpi-card.yellow { border-top-color: var(--accent-yellow); }
        .kpi-card.green { border-top-color: var(--accent-green); }
        .kpi-label { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; margin-bottom: 8px; }
        .kpi-value { font-size: 2rem; font-weight: 700; margin-bottom: 4px; }
        .kpi-subtext { font-size: 0.75rem; color: var(--text-muted); }

        /* Alert Panel */
        .alert-panel { background-color: rgba(15, 20, 28, 0.6); border: 1px solid #d97706; border-radius: 8px; padding: 20px; margin-bottom: 32px; }
        .alert-title { font-size: 0.85rem; font-weight: 700; color: var(--accent-yellow); display: flex; align-items: center; gap: 8px; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.5px; }
        .alert-list { display: flex; flex-direction: column; gap: 10px; }
        .alert-item { background: #1a202c; border-left: 4px solid var(--accent-yellow); padding: 12px 16px; border-radius: 0 6px 6px 0; font-size: 0.87rem; display: flex; justify-content: space-between; align-items: center; }
        .alert-badge { font-size: 0.7rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: rgba(245,158,11,0.15); margin-left: 8px; }

        /* Buttons & Tables */
        .btn { padding: 10px 20px; border-radius: 6px; font-weight: 600; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 0.875rem; }
        .btn-primary { background-color: var(--accent-green); color: #fff; }
        .btn-secondary { background-color: #374151; color: var(--text-main); }
        .btn-action { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); padding: 6px 12px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; font-weight: 500; }
        .btn-link-doc { border-color: #3b82f6; color: #3b82f6; }

        .table-container { background-color: var(--bg-card); border-radius: 8px; border: 1px solid var(--border-color); overflow: hidden; margin-top: 24px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.875rem; }
        th { background-color: #1a2236; padding: 16px; font-weight: 600; color: var(--text-muted); border-bottom: 1px solid var(--border-color); }
        td { padding: 16px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
        .td-plate { font-family: monospace; font-size: 0.95rem; font-weight: 700; color: #60a5fa; }
        .doc-link-anchor { color: #60a5fa; text-decoration: none; font-weight: 500; font-size: 0.82rem; }
        .doc-link-anchor:hover { text-decoration: underline; }

        /* View Switching */
        .view-section { display: none; }
        .view-section.active-view { display: block; }

        /* Modal Overlay */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0,0,0,0.75); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-box { background-color: var(--bg-card); border-radius: 8px; border: 1px solid var(--border-color); width: 100%; max-width: 500px; overflow: hidden; }
