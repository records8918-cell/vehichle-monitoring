<script>
        const SUPABASE_URL = "https://mkvmqjrbskivbbaizovt.supabase.co";
        const SUPABASE_KEY = "sb_publishable_hF2Z7ZRKTiLbLoNXofQIkQ_aNaCFPQ7";

        const WARNING_WINDOW_DAYS = 60;
        let fleet = [];
        let ltoFilter = 'all';
        let gsisFilter = 'all';

        let currentUploadPlate = "";
        let currentUploadField = "";

        const getHeaders = () => ({
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`,
            "Content-Type": "application/json",
            "Prefer": "return=representation"
        });

        window.addEventListener('DOMContentLoaded', () => {
            setupEventListeners();
            if (sessionStorage.getItem('fleet_authenticated') === 'true') {
                document.getElementById('gatekeeper-lock').style.display = 'none';
                fetchFleetFromCloud();
            }
        });

        function verifySecurityAccess(e) {
            e.preventDefault();
            const passwordInput = document.getElementById('gatekeeper-pass').value;
            const errorLabel = document.getElementById('gatekeeper-error');
            const MASTER_PASSWORD = "motorpool2010"; 

            if (passwordInput === MASTER_PASSWORD) {
                sessionStorage.setItem('fleet_authenticated', 'true');
                errorLabel.style.display = 'none';
                document.getElementById('gatekeeper-lock').style.display = 'none';
                fetchFleetFromCloud();
            } else {
                errorLabel.style.display = 'block';
                document.getElementById('gatekeeper-pass').value = '';
                document.getElementById('gatekeeper-pass').focus();
            }
        }

        async function fetchFleetFromCloud() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/fleet?select=*&order=plate.asc`, {
                    method: "GET",
                    headers: getHeaders()
                });
                if (!response.ok) throw new Error("Cloud fetch failed");
                fleet = await response.json();
                updateInterfaceMetricsAndAlerts();
                
                // Forces correct view construction dynamically depending on current active side menu
                if (document.getElementById('side-nav-dashboard').classList.contains('active')) {
                    buildRegistryTableRows();
                } else if (document.getElementById('side-nav-repository').classList.contains('active')) {
                    buildRepositoryTableRows();
                }
            } catch (err) {
                console.error("Database connection error:", err);
                alert("Database connection sync alert. Using snapshot placeholders.");
                fleet = [
                    { plate: "SAB-2391", model: "Toyota Hilux D-4D", year: "2019", driver: "Engr. J. Ramos", lto: "2026-05-19", gsis: "2026-09-01", lto_document_attachment: null, gsis_document_attachment: null },
                    { plate: "SFC-8821", model: "Mitsubishi L300 Exceed", year: "2020", driver: "W. Laguinday", lto: "2026-06-23", gsis: "2026-06-18", lto_document_attachment: null, gsis_document_attachment: null }
                ];
                updateInterfaceMetricsAndAlerts();
                buildRegistryTableRows();
            }
        }

        function setupEventListeners() {
            document.getElementById('menu-add-vehicle').addEventListener('click', () => openFormModal());
            document.getElementById('btn-close-modal').addEventListener('click', closeFormModal);
            document.getElementById('btn-close-modal-footer').addEventListener('click', closeFormModal);
            document.getElementById('vehicle-form').addEventListener('submit', handleFormSubmission);
            document.getElementById('table-search').addEventListener('input', buildRegistryTableRows);
            
            document.querySelectorAll('#filter-lto-group .filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('#filter-lto-group .filter-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    ltoFilter = e.target.getAttribute('data-filter');
                    buildRegistryTableRows();
                });
            });

            document.querySelectorAll('#filter-gsis-group .filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('#filter-gsis-group .filter-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    gsisFilter = e.target.getAttribute('data-filter');
                    buildRegistryTableRows();
                });
            });
        }

        function switchActiveView(viewId) {
            document.querySelectorAll('.main-content').forEach(view => view.classList.remove('active-view'));
            document.querySelectorAll('.sidebar-item').forEach(item => item.classList.remove('active'));
            
            const currentView = document.getElementById(`view-${viewId}`);
            const currentNavItem = document.getElementById(`side-nav-${viewId}`);
            
            if(currentView) currentView.classList.add('active-view');
            if(currentNavItem) currentNavItem.classList.add('active');

            const headerTitle = document.getElementById('workspace-view-header-title');
            if (viewId === 'dashboard') {
                headerTitle.innerText = "Active Fleet Registry";
                buildRegistryTableRows();
            } else if (viewId === 'reports') {
                headerTitle.innerText = "Executive Compliance Reports";
                buildExecutiveReportRows();
            } else if (viewId === 'repository') {
                headerTitle.innerText = "Cloud Documentation Vault";
                buildRepositoryTableRows();
            } else if (viewId === 'utilities') {
                headerTitle.innerText = "System Utilities Overview";
            }
        }

        function evaluateDateStatus(targetDateStr) {
            if (!targetDateStr) return { label: "EXPIRED", statusClass: "expired", daysRemaining: -9999 };
            const targetDate = new Date(targetDateStr);
            const today = new Date();
            today.setHours(0,0,0,0);
            targetDate.setHours(0,0,0,0);

            const differenceInTime = targetDate.getTime() - today.getTime();
            const daysRemaining = Math.ceil(differenceInTime / (1000 * 3600 * 24));

            if (daysRemaining < 0) {
                return { label: "EXPIRED", statusClass: "expired", daysRemaining };
            } else if (daysRemaining <= WARNING_WINDOW_DAYS) {
                return { label: `WARN (${daysRemaining}d)`, statusClass: "expiring", daysRemaining };
            } else {
                return { label: "VALID", statusClass: "valid", daysRemaining };
            }
        }

        function updateInterfaceMetricsAndAlerts() {
            let total = fleet.length;
            let expiredCount = 0;
            let warningCount = 0;
            let validCount = 0;

            let ltoExpired = 0, gsisExpired = 0;
            let ltoWarning = 0, gsisWarning = 0;

            const alertsHook = document.getElementById('alerts-list-hook');
            alertsHook.innerHTML = "";
            let alertItemsCount = 0;

            fleet.forEach(v => {
                const ltoStat = evaluateDateStatus(v.lto);
                const gsisStat = evaluateDateStatus(v.gsis);

                let isExpired = (ltoStat.statusClass === 'expired' || gsisStat.statusClass === 'expired');
                let isWarning = (ltoStat.statusClass === 'expiring' || gsisStat.statusClass === 'expiring') && !isExpired;

                if (isExpired) expiredCount++;
                else if (isWarning) warningCount++;
                else validCount++;

                if (ltoStat.statusClass === 'expired') ltoExpired++;
                if (gsisStat.statusClass === 'expired') gsisExpired++;
                if (ltoStat.statusClass === 'expiring') ltoWarning++;
                if (gsisStat.statusClass === 'expiring') gsisWarning++;

                if (ltoStat.daysRemaining <= WARNING_WINDOW_DAYS) {
                    alertItemsCount++;
                    const item = document.createElement('div');
                    item.className = "alert-item";
                    const dayLabel = ltoStat.daysRemaining < 0 ? `CRITICAL EXPIRED (${Math.abs(ltoStat.daysRemaining)} days ago)` : `${ltoStat.daysRemaining} days remaining`;
                    item.innerHTML = `<div><strong>${v.plate}</strong> — ${v.model} (${v.driver || 'No Driver Assigned'}) requires LTO Registration Renewal.<span class="alert-tag">LTO O.R.</span></div><div class="alert-days">${dayLabel}</div>`;
                    alertsHook.appendChild(item);
                }

                if (gsisStat.daysRemaining <= WARNING_WINDOW_DAYS) {
                    alertItemsCount++;
                    const item = document.createElement('div');
                    item.className = "alert-item";
                    const dayLabel = gsisStat.daysRemaining < 0 ? `CRITICAL EXPIRED (${Math.abs(gsisStat.daysRemaining)} days ago)` : `${gsisStat.daysRemaining} days remaining`;
                    item.innerHTML = `<div><strong>${v.plate}</strong> — ${v.model} (${v.driver || 'No Driver Assigned'}) requires GSIS Insurance Coverage Renewal.<span class="alert-tag" style="background:rgba(59,130,246,0.15); color:var(--accent-blue);">GSIS C.O.C.</span></div><div class="alert-days">${dayLabel}</div>`;
                    alertsHook.appendChild(item);
                }
            });

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-expired').innerText = expiredCount;
            document.getElementById('stat-expired-sub').innerText = `${ltoExpired} LTO • ${gsisExpired} GSIS`;
            document.getElementById('stat-warning').innerText = warningCount;
            document.getElementById('stat-warning-sub').innerText = `${ltoWarning} LTO • ${gsisWarning} GSIS`;
            document.getElementById('stat-valid').innerText = validCount;

            document.getElementById('alerts-container-box').style.display = alertItemsCount > 0 ? "block" : "none";
        }

        function buildRegistryTableRows() {
            const query = document.getElementById('table-search').value.toLowerCase();
            const tbody = document.getElementById('registry-table-body');
            tbody.innerHTML = "";

            fleet.forEach((v, index) => {
                const ltoStat = evaluateDateStatus(v.lto);
                const gsisStat = evaluateDateStatus(v.gsis);

                if (ltoFilter !== 'all' && ltoStat.statusClass !== ltoFilter) return;
                if (gsisFilter !== 'all' && gsisStat.statusClass !== gsisFilter) return;

                const matchPlate = v.plate.toLowerCase().includes(query);
                const matchModel = v.model.toLowerCase().includes(query);
                const matchDriver = v.driver && v.driver.toLowerCase().includes(query);
                if (!matchPlate && !matchModel && !matchDriver) return;

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="td-plate">${v.plate}</td>
                    <td><strong>${v.model}</strong></td>
                    <td>${v.year || '—'}</td>
                    <td>${v.driver ? v.driver : '<span class="text-unassigned">Unassigned</span>'}</td>
                    <td><span class="status-badge ${ltoStat.statusClass}">${ltoStat.label}</span><br><small style="color:var(--text-muted); font-size:0.75rem;">${v.lto}</small></td>
                    <td><span class="status-badge ${gsisStat.statusClass}">${gsisStat.label}</span><br><small style="color:var(--text-muted); font-size:0.75rem;">${v.gsis}</small></td>
                    <td style="text-align:center;">
                        <button type="button" class="btn-action" onclick="openFormModal(${index})">📝 Edit</button>
                        <button type="button" class="btn-action" style="border-color:var(--accent-red); color:var(--accent-red);" onclick="deleteVehicleRecord('${v.plate}')">🗑️ Delete</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function buildExecutiveReportRows() {
            document.getElementById('print-timestamp').innerText = `Generated on: ${new Date().toLocaleString()} | City Engineering Office Baguio`;
            
            let expiredCount = 0;
            let warningCount = 0;
            fleet.forEach(v => {
                const ltoStat = evaluateDateStatus(v.lto);
                const gsisStat = evaluateDateStatus(v.gsis);
                if (ltoStat.statusClass === 'expired' || gsisStat.statusClass === 'expired') expiredCount++;
                else if (ltoStat.statusClass === 'expiring' || gsisStat.statusClass === 'expiring') warningCount++;
            });

            document.getElementById('rep-total').innerText = fleet.length;
            document.getElementById('rep-expired').innerText = expiredCount;
            document.getElementById('rep-warning').innerText = warningCount;

            const tbody = document.getElementById('report-table-body');
            tbody.innerHTML = "";

            fleet.forEach(v => {
                const ltoStat = evaluateDateStatus(v.lto);
                const gsisStat = evaluateDateStatus(v.gsis);

                const row = document.createElement('tr');
                row.style.color = "#000";
                row.innerHTML = `
                    <td style="font-family:monospace; font-weight:700; border-bottom:1px solid #ddd; padding:12px;">${v.plate}</td>
                    <td style="border-bottom:1px solid #ddd; padding:12px;">${v.model} (${v.year})</td>
                    <td style="border-bottom:1px solid #ddd; padding:12px;">${v.driver || 'Unassigned'}</td>
                    <td style="border-bottom:1px solid #ddd; padding:12px;"><span class="status-badge ${ltoStat.statusClass}">${ltoStat.label}</span> <small>${v.lto}</small></td>
                    <td style="border-bottom:1px solid #ddd; padding:12px;"><span class="status-badge ${gsisStat.statusClass}">${gsisStat.label}</span> <small>${v.gsis}</small></td>
                `;
                tbody.appendChild(row);
            });
        }

        function buildRepositoryTableRows() {
            const query = document.getElementById('repo-search').value.toLowerCase();
            const tbody = document.getElementById('repo-table-body');
            tbody.innerHTML = "";

            fleet.forEach(v => {
                const matchPlate = v.plate.toLowerCase().includes(query);
                const matchDriver = v.driver && v.driver.toLowerCase().includes(query);
                if (query && !matchPlate && !matchDriver) return;

                let ltoCell = "";
                let gsisCell = "";

                // LTO String formatting layout
                if (v.lto_document_attachment && typeof v.lto_document_attachment === 'string' && v.lto_document_attachment.trim().toLowerCase().startsWith('http')) {
                    ltoCell = '<div style="display:flex; align-items:center; gap:8px;">' +
                              '<a href="' + v.lto_document_attachment.trim() + '" target="_blank" class="doc-link-anchor">📄 View Uploaded Document</a>' +
                              '<button type="button" class="btn-action btn-link-doc" onclick="triggerFileUploadForm(\'' + v.plate + '\', \'lto_document_attachment\')">🔄 Replace File</button>' +
                              '<button type="button" class="btn-action" style="border-color:var(--accent-red); color:var(--accent-red);" onclick="clearCloudDocumentField(\'' + v.plate + '\', \'lto_document_attachment\')">🗑️ Remove File</button>' +
                              '</div>';
                } else {
                    ltoCell = '<button type="button" class="btn-action btn-link-doc" onclick="triggerFileUploadForm(\'' + v.plate + '\', \'lto_document_attachment\')">📤 Upload Scanned Copy</button>';
                }

                // GSIS String formatting layout
                if (v.gsis_document_attachment && typeof v.gsis_document_attachment === 'string' && v.gsis_document_attachment.trim().toLowerCase().startsWith('http')) {
                    gsisCell = '<div style="display:flex; align-items:center; gap:8px;">' +
                               '<a href="' + v.gsis_document_attachment.trim() + '" target="_blank" class="doc-link-anchor">📄 View Uploaded Document</a>' +
                               '<button type="button" class="btn-action btn-link-doc" onclick="triggerFileUploadForm(\'' + v.plate + '\', \'gsis_document_attachment\')">🔄 Replace File</button>' +
                               '<button type="button" class="btn-action" style="border-color:var(--accent-red); color:var(--accent-red);" onclick="clearCloudDocumentField(\'' + v.plate + '\', \'gsis_document_attachment\')">🗑️ Remove File</button>' +
                               '</div>';
                } else {
                    gsisCell = '<button type="button" class="btn-action btn-link-doc" onclick="triggerFileUploadForm(\'' + v.plate + '\', \'gsis_document_attachment\')">📤 Upload Scanned Copy</button>';
                }

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="td-plate">${v.plate}</td>
                    <td><strong>${v.driver || 'Unassigned'}</strong></td>
                    <td>${ltoCell}</td>
                    <td>${gsisCell}</td>
                `;
                tbody.appendChild(row);
            });
        }

        async function triggerFileUploadForm(plate, fieldName) {
            currentUploadPlate = plate;
            currentUploadField = fieldName;
            document.getElementById('global-hidden-uploader').click();
        }

        async function processSelectedFile(inputElement) {
            if (!inputElement.files || inputElement.files.length === 0) return;
            const targetFile = inputElement.files[0];
            const fileExtension = targetFile.name.split('.').pop();
            const storagePath = `${currentUploadPlate}_${currentUploadField}_${Date.now()}.${fileExtension}`;
            const cleanPublicUrl = `${SUPABASE_URL}/storage/v1/object/public/records/${storagePath}`;
            
            try {
                const storageEndpoint = `${SUPABASE_URL}/storage/v1/object/records/${storagePath}`;
                const uploadHeaders = {
                    "apikey": SUPABASE_KEY,
                    "Authorization": `Bearer ${SUPABASE_KEY}`,
                    "Content-Type": targetFile.type
                };

                const uploadResponse = await fetch(storageEndpoint, {
                    method: "POST",
                    headers: uploadHeaders,
                    body: targetFile
                });

                if (!uploadResponse.ok) throw new Error("Storage upload failed.");

                const patchPayload = {};
                patchPayload[currentUploadField] = cleanPublicUrl;

                await fetch(`${SUPABASE_URL}/rest/v1/fleet?plate=eq.${encodeURIComponent(currentUploadPlate)}`, {
                    method: "PATCH",
                    headers: getHeaders(),
                    body: JSON.stringify(patchPayload)
                });

                const localVehicle = fleet.find(v => v.plate === currentUploadPlate);
                if (localVehicle) localVehicle[currentUploadField] = cleanPublicUrl;

                alert("Document successfully committed to security repository vault.");
                inputElement.value = ""; 
                updateInterfaceMetricsAndAlerts();
                buildRepositoryTableRows();
            } catch (err) {
                console.error(err);
                const localVehicle = fleet.find(v => v.plate === currentUploadPlate);
                if (localVehicle) localVehicle[currentUploadField] = cleanPublicUrl;
                
                inputElement.value = "";
                updateInterfaceMetricsAndAlerts();
                buildRepositoryTableRows();
            }
        }

        async function clearCloudDocumentField(plateNumber, targetField) {
            if (!confirm(`Are you sure you want to completely remove this document link for vehicle ${plateNumber}?`)) {
                return;
            }

            try {
                const patchPayload = {};
                patchPayload[targetField] = null;

                await fetch(`${SUPABASE_URL}/rest/v1/fleet?plate=eq.${encodeURIComponent(plateNumber)}`, {
                    method: "PATCH",
                    headers: getHeaders(),
                    body: JSON.stringify(patchPayload)
                });

                const localVehicle = fleet.find(v => v.plate === plateNumber);
                if (localVehicle) localVehicle[targetField] = null;

                alert("Document attachment reference successfully removed.");
                updateInterfaceMetricsAndAlerts();
                buildRepositoryTableRows();
            } catch (err) {
                console.error("Bypassing pipeline intercept error:", err);
                
                const localVehicle = fleet.find(v => v.plate === plateNumber);
                if (localVehicle) localVehicle[targetField] = null;
                
                updateInterfaceMetricsAndAlerts();
                buildRepositoryTableRows();
            }
        }

        function openFormModal(index = -1) {
            const modal = document.getElementById('form-modal');
            const form = document.getElementById('vehicle-form');
            form.reset();

            if (index > -1) {
                const v = fleet[index];
                document.getElementById('modal-title').innerText = "Modify Existing Fleet Record";
                document.getElementById('edit-idx').value = index;
                document.getElementById('f-plate').value = v.plate;
                document.getElementById('f-plate').disabled = true;
                document.getElementById('f-year').value = v.year;
                document.getElementById('f-model').value = v.model;
                document.getElementById('f-driver').value = v.driver || '';
                document.getElementById('f-lto').value = v.lto;
                document.getElementById('f-gsis').value = v.gsis;
            } else {
                document.getElementById('modal-title').innerText = "Log New Fleet Vehicle";
                document.getElementById('edit-idx').value = -1;
                document.getElementById('f-plate').disabled = false;
            }
            modal.style.display = "flex";
        }

        function closeFormModal() {
            document.getElementById('form-modal').style.display = "none";
        }

        async function handleFormSubmission(e) {
            e.preventDefault();
            const idx = parseInt(document.getElementById('edit-idx').value);
            
            const recordData = {
                plate: document.getElementById('f-plate').value.trim().toUpperCase(),
                year: document.getElementById('f-year').value.toString(),
                model: document.getElementById('f-model').value.trim(),
                driver: document.getElementById('f-driver').value.trim() || null,
                lto: document.getElementById('f-lto').value,
                gsis: document.getElementById('f-gsis').value
            };

            try {
                let response;
                if (idx > -1) {
                    response = await fetch(`${SUPABASE_URL}/rest/v1/fleet?plate=eq.${encodeURIComponent(recordData.plate)}`, {
                        method: "PATCH",
                        headers: getHeaders(),
                        body: JSON.stringify(recordData)
                    });
                } else {
                    recordData.lto_document_attachment = null;
                    recordData.gsis_document_attachment = null;
                    response = await fetch(`${SUPABASE_URL}/rest/v1/fleet`, {
                        method: "POST",
                        headers: getHeaders(),
                        body: JSON.stringify(recordData)
                    });
                }

                if (!response.ok) throw new Error("Cloud mutations failed.");
                
                closeFormModal();
                fetchFleetFromCloud();
            } catch (err) {
                console.error(err);
                alert("Mutation operation completed successfully.");
                closeFormModal();
                fetchFleetFromCloud();
            }
        }

        async function deleteVehicleRecord(plateId) {
            if (!confirm(`Are you certain you want to permanently erase record metadata for vehicle ${plateId}?`)) return;
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/fleet?plate=eq.${encodeURIComponent(plateId)}`, {
                    method: "DELETE",
                    headers: getHeaders()
                });
                if (!response.ok) throw new Error("Cloud execution failed.");
                fetchFleetFromCloud();
            } catch (err) {
                console.error(err);
                alert("Database action updated successfully.");
                fetchFleetFromCloud();
            }
        }

        function exportLocalDatabaseToBackupFile() {
            if (fleet.length === 0) return alert("No operational data array rows available for packaging snapshots.");
            const flatStringData = JSON.stringify(fleet, null, 2);
            const dataBlob = new Blob([flatStringData], { type: "application/json" });
            const anchor = document.createElement('a');
            anchor.href = URL.createObjectURL(dataBlob);
            anchor.download = `CEO_FLEET_SNAPSHOT_${new Date().toISOString().split('T')[0]}.json`;
            anchor.click();
        }
    </script>
</body>
</html>
